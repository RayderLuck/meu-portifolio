<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Rayder Luck</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
        --text-color: #ffffff;
        --primary-color: #00ff66;
        --box-bg: rgba(5, 5, 5, 0.88);
        --border-color: rgba(0, 255, 102, 0.4);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        background-color: transparent; /* Deixa o fundo transparente para o Matrix aparecer */
        color: var(--text-color);
        font-family: 'Courier New', Courier, monospace;
        overflow-x: hidden;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    /* --- Fundo Matrix Fixo --- */
    #matrix {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
    }

    /* --- Wrapper Geral --- */
    .wrapper {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 1;
    }

    /* --- Perfil --- */
    .profile-header {
        text-align: center;
        margin-bottom: 25px;
        width: 100%;
    }

    .profile-header h1 {
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .profile-header .subtitle {
        font-size: 1rem;
        color: var(--primary-color);
        margin: 5px 0;
        text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    .profile-header .role {
        font-size: 0.75rem;
        opacity: 0.7;
        letter-spacing: 0.5px;
    }

    /* --- Caixa de Links (Dark Box) --- */
    .links-box {
        background-color: var(--box-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px 16px;
        width: 100%;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .links-box h2 {
        font-size: 0.85rem;
        color: var(--primary-color);
        margin-bottom: 15px;
        text-align: left;
        opacity: 0.9;
        border-left: 3px solid var(--primary-color);
        padding-left: 8px;
    }

    /* --- Lista de Botões --- */
    .link-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .link-item {
        display: flex;
        align-items: center;
        gap: 15px;
        background-color: rgba(20, 20, 20, 0.95);
        color: var(--text-color);
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .link-item i {
        font-size: 1.1rem;
        color: var(--primary-color);
        width: 22px;
        text-align: center;
    }

    .link-item:hover {
        background-color: var(--primary-color);
        color: #000;
        border-color: var(--primary-color);
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
    }

    .link-item:hover i {
        color: #000;
    }

    /* --- Rodapé --- */
    .main-footer {
        width: 100%;
        text-align: center;
        font-size: 0.7rem;
        opacity: 0.5;
        z-index: 1;
        letter-spacing: 1px;
        margin-top: 25px;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- Container Principal -->
  <main class="wrapper">
    <header class="profile-header">
      <h1>Lucas Trindade</h1>
      <p class="subtitle">&lt;Rayder Luck /&gt;</p>
      <p class="role">DEV FULL SOLO | Tech Leader | Web3 Enthusiast</p>
    </header>

    <!-- Caixa de Links Estilo Dark/Hacker -->
    <div class="links-box">
      <h2>// Conecte-se comigo</h2>
      <ul class="link-list">
        <li>
          <a href="https://wa.me/5522998293660" target="_blank" class="link-item">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/lucastrindaderayder/" target="_blank" class="link-item">
            <i class="fa-brands fa-instagram"></i> Instagram
          </a>
        </li>
        <li>
          <a href="https://github.com/RayderLuck" target="_blank" class="link-item">
            <i class="fa-brands fa-github"></i> GitHub
          </a>
        </li>
        <li>
          <a href="mailto:lucastrindaderayder@hotmail.com" class="link-item">
            <i class="fa-solid fa-envelope"></i> E-mail
          </a>
        </li>
      </ul>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="main-footer">
    <p>© 2026 - Lucas Trindade</p>
  </footer>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.height = window.innerHeight;
      canvas.width = window.innerWidth;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0F0";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 33);
  </script>
</body>
</html>
